name: prefect-docker-pixi-tiled-qas
prefect-version: 3.6.10

build: null

push: null

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /repo
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/JunAishima/qas-workflows.git
      branch: add-adapter

deployments:
  - name: qas-end-of-run-workflow-docker
    version: 0.1.2
    tags:
      - qas
      - main
    description: Deploy the updated Docker image
    entrypoint: end_of_run_workflow.py:end_of_run_workflow
    parameters: {}
    schedule: {}
    work_pool:
      job_variables:
        image: ghcr.io/junaishima/qas-workflows:add-adapter
        image_pull_policy: Always
        network: slirp4netns
        volumes:
          - /nsls2/data/qas-new/proposals:/nsls2/data/qas-new/proposals
          - /srv/prefect3-docker-worker-qas/app:/srv
        container_create_kwargs:
          userns_mode: "keep-id:uid=402951,gid=402951"
        auto_remove: true
      name: qas-work-pool-docker
